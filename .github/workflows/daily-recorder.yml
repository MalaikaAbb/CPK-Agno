name: Daily Auto-Update and Demo Recording

on:
  schedule:
    # Runs every day at 06:00 UTC (11:00 AM PKT / adjust as desired)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      run_all_pages:
        description: 'Record ALL 17 pages (default / uncheck to choose specific pages below)'
        required: false
        type: boolean
        default: true
      upgrade_packages:
        description: 'Upgrade packages (ncu -u --peer & uv sync --upgrade)'
        required: false
        type: boolean
        default: false
      fail_on_doc_drift:
        description: 'Fail immediately if doc drift is detected'
        required: false
        type: boolean
        default: false
      custom_args:
        description: 'Or type custom CLI args (e.g. --limit=5)'
        required: false
        type: string
        default: ''

      # Individual Page Selection Checkboxes
      page_quickstart:
        description: 'Page 01: Quickstart'
        type: boolean
        default: false
      page_prebuilt_components:
        description: 'Page 02: Prebuilt Components'
        type: boolean
        default: false
      page_threads_drawer:
        description: 'Page 03: Rich Threads - Threads Drawer'
        type: boolean
        default: false
      page_threads_headless:
        description: 'Page 04: Rich Threads - Headless Threads'
        type: boolean
        default: false
      page_threads_lifecycle:
        description: 'Page 05: Rich Threads - Thread & History Lifecycle'
        type: boolean
        default: false
      page_programmatic_control:
        description: 'Page 06: Custom Look and Feel - Programmatic Control'
        type: boolean
        default: false
      page_inspector:
        description: 'Page 07: Custom Look and Feel - Inspector'
        type: boolean
        default: false
      page_slots:
        description: 'Page 08: Custom Look and Feel - Slots'
        type: boolean
        default: false
      page_headless_ui:
        description: 'Page 09: Custom Look and Feel - Headless UI'
        type: boolean
        default: false
      page_display_only:
        description: 'Page 10: Generative UI - Display Only Component'
        type: boolean
        default: false
      page_interactive:
        description: 'Page 11: Generative UI - Interactive Component'
        type: boolean
        default: false
      page_tool_rendering:
        description: 'Page 12: Generative UI - Tool Rendering'
        type: boolean
        default: false
      page_frontend_tools:
        description: 'Page 13: App Control - Frontend Tools'
        type: boolean
        default: false
      page_human_in_the_loop:
        description: 'Page 14: App Control - Human in the Loop'
        type: boolean
        default: false
      page_copilot_runtime:
        description: 'Page 15: Backend - Copilot Runtime'
        type: boolean
        default: false
      page_ag_ui:
        description: 'Page 16: Backend - AG-UI Protocol Stream'
        type: boolean
        default: false
      page_error_debugging:
        description: 'Page 17: Troubleshooting - Error Debugging & Observability'
        type: boolean
        default: false

jobs:
  record-workers:
    name: Worker ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}
      NEXT_PUBLIC_COPILOTKIT_LICENSE_KEY: ${{ secrets.NEXT_PUBLIC_COPILOTKIT_LICENSE_KEY || secrets.COPILOTKIT_LICENSE_TOKEN }}
      INTELLIGENCE_API_KEY: ${{ secrets.INTELLIGENCE_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            autorecorder/package-lock.json

      - name: Install Playwright & System Chromium Dependencies
        run: |
          cd autorecorder
          npm install
          npx playwright install --with-deps chromium

      - name: Run Automation Pipeline & Record Demos (Shard ${{ matrix.shard }}/3)
        run: |
          # 1. Custom CLI args override everything if provided
          if [ -n "${{ inputs.custom_args }}" ]; then
            RECORD_ARGS="${{ inputs.custom_args }}"
          else
            # 2. Check if individual page checkboxes were selected
            PAGES=()
            [ "${{ inputs.page_quickstart }}" = "true" ] && PAGES+=("quickstart")
            [ "${{ inputs.page_prebuilt_components }}" = "true" ] && PAGES+=("prebuilt-components")
            [ "${{ inputs.page_threads_drawer }}" = "true" ] && PAGES+=("threads-drawer")
            [ "${{ inputs.page_threads_headless }}" = "true" ] && PAGES+=("threads-headless")
            [ "${{ inputs.page_threads_lifecycle }}" = "true" ] && PAGES+=("threads-lifecycle")
            [ "${{ inputs.page_programmatic_control }}" = "true" ] && PAGES+=("programmatic-control")
            [ "${{ inputs.page_inspector }}" = "true" ] && PAGES+=("inspector")
            [ "${{ inputs.page_slots }}" = "true" ] && PAGES+=("slots")
            [ "${{ inputs.page_headless_ui }}" = "true" ] && PAGES+=("headless-ui")
            [ "${{ inputs.page_display_only }}" = "true" ] && PAGES+=("display-only")
            [ "${{ inputs.page_interactive }}" = "true" ] && PAGES+=("interactive")
            [ "${{ inputs.page_tool_rendering }}" = "true" ] && PAGES+=("tool-rendering")
            [ "${{ inputs.page_frontend_tools }}" = "true" ] && PAGES+=("frontend-tools")
            [ "${{ inputs.page_human_in_the_loop }}" = "true" ] && PAGES+=("human-in-the-loop")
            [ "${{ inputs.page_copilot_runtime }}" = "true" ] && PAGES+=("copilot-runtime")
            [ "${{ inputs.page_ag_ui }}" = "true" ] && PAGES+=("ag-ui")
            [ "${{ inputs.page_error_debugging }}" = "true" ] && PAGES+=("error-debugging")

            if [ ${#PAGES[@]} -gt 0 ]; then
              JOINED=$(IFS=,; echo "${PAGES[*]}")
              RECORD_ARGS="--pages=$JOINED --shard=${{ matrix.shard }}/3"
            else
              # Default: split all 17 pages across 3 shards
              RECORD_ARGS="--shard=${{ matrix.shard }}/3"
            fi
          fi

          EXTRA_FLAGS=""
          if [ "${{ inputs.upgrade_packages }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --upgrade"
          fi
          if [ "${{ inputs.fail_on_doc_drift }}" != "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --ignore-doc-drift"
          fi

          echo "Running worker shard ${{ matrix.shard }}/3 with flags: $EXTRA_FLAGS $RECORD_ARGS"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scripts/automate.mjs $EXTRA_FLAGS $RECORD_ARGS

      - name: Publish Shard Report to GitHub Summary
        if: always()
        run: |
          if [ -f "autorecorder/videos/RUN_REPORT.md" ]; then
            echo "### 🧩 Worker Shard ${{ matrix.shard }}/3 Summary" >> $GITHUB_STEP_SUMMARY
            cat autorecorder/videos/RUN_REPORT.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Shard Recorded Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-recordings-shard-${{ matrix.shard }}
          path: |
            autorecorder/videos/*.webm
            autorecorder/videos/RUN_REPORT.md
            autorecorder/videos/RUN_REPORT.json
          if-no-files-found: ignore
          retention-days: 14

  consolidate-recordings:
    name: Consolidate & Merge All Video Artifacts
    needs: record-workers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-recordings
          pattern: demo-recordings-shard-*
          merge-multiple: true

      - name: Upload Consolidated Demo Recordings Package
        uses: actions/upload-artifact@v4
        with:
          name: demo-recordings-all-${{ github.sha }}
          path: all-recordings/
          if-no-files-found: ignore
          retention-days: 14
